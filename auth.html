<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HocanıSeç | Öğrenci Doğrulama</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-wrap{min-height:100vh; display:grid; place-items:center; padding:24px; background: #f8fafc;}
    .auth-card{width:min(500px, 100%); background:white; border:1px solid #e2e8f0; border-radius:24px; box-shadow:0 20px 25px -5px rgba(0, 0, 0, 0.1); padding:32px}
    .auth-card h1{font-size:24px; margin-bottom:8px; font-weight:800; color: #0f172a; letter-spacing: -0.02em;}
    .auth-card p{color:#64748b; font-size:15px; margin-bottom:24px; line-height: 1.5}
    
    .input-group { margin-bottom: 20px; }
    .input-label { display: block; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 6px; }
    
    input[type="email"], input[type="text"]{
      width:100%; border:1.5px solid #e2e8f0; border-radius:14px; padding:14px; font-size:15px; outline:none; transition: all 0.2s;
    }
    input:focus{ border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }
    
    .terms-container {
      background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 16px; margin-bottom: 20px;
    }
    .term-item { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; cursor: pointer; }
    .term-item:last-child { margin-bottom: 0; }
    .term-item input { width: 18px; height: 18px; cursor: pointer; accent-color: #2563eb; margin-top: 2px; }
    .term-text { font-size: 13px; color: #475569; line-height: 1.4; }
    .term-text b { color: #2563eb; text-decoration: underline; }

    button{
      width: 100%; border:none; cursor:pointer; padding:14px; border-radius:14px; background:#2563eb; color:white; font-weight:800; font-size: 16px; transition: all 0.2s;
    }
    button:hover{ background: #1e40af; transform: translateY(-1px); }
    button:disabled{ opacity:.5; cursor:not-allowed; transform: none; }
    
    .codeBox{ display:none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
    .codeBox.is-open{ display:block; }
    
    .msg{ margin-top:15px; font-size:14px; padding: 12px; border-radius: 12px; display: none; text-align: center; font-weight: 600; }
    .msg.ok{ display: block; color:#16a34a; background: #f0fdf4; border: 1px solid #bbf7d0; }
    .msg.err{ display: block; color:#dc2626; background: #fef2f2; border: 1px solid #fecaca; }

    .footer-note { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 20px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 id="mainTitle">HocanıSeç'e Hoş Geldin</h1>
      <p>Yorum yapabilmek için öğrenci olduğunu doğrulamamız gerekiyor.</p>

      <div class="input-group">
        <label class="input-label">Öğrenci E-postası</label>
        <input id="email" type="email" placeholder="isminiz@universite.edu.tr" />
      </div>

      <!-- ONAY KUTULARI -->
      <div class="terms-container" id="requirements">
        <label class="term-item">
          <input type="checkbox" id="checkKVKK">
          <span class="term-text"><b onclick="showModal('kvkk')">KVKK Aydınlatma Metni</b>'ni okudum, kişisel verilerimin anonim olarak işlenmesini kabul ediyorum.</span>
        </label>
        <label class="term-item">
          <input type="checkbox" id="checkRules">
          <span class="term-text">Yorumlarımda <b>hakaret, küfür ve iftira</b> bulunmayacağını, topluluk kurallarına uyacağımı taahhüt ederim.</span>
        </label>
        <label class="term-item">
          <input type="checkbox" id="checkAuth">
          <span class="term-text">Bu e-posta adresinin <b>şahsıma ait olduğunu</b> ve okul öğrencisi olduğumu beyan ederim.</span>
        </label>
      </div>

      <button id="sendBtn">Doğrulama Kodu Gönder</button>

      <div id="codeBox" class="codeBox">
        <div class="input-group">
          <label class="input-label">E-postana Gelen 6 Haneli Kod</label>
          <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="000000" />
        </div>
        <button id="verifyBtn" style="background: #0f172a;">Hesabı Doğrula</button>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button id="resendBtn" style="background: #64748b; font-size: 13px;">Tekrar Gönder</button>
            <button id="logoutBtn" style="background: #ef4444; font-size: 13px;">İptal</button>
        </div>
      </div>

      <div id="status" class="msg"></div>

      <div class="footer-note">
        Doğrulama başarılı olduğunda direkt ana sayfaya yönlendirileceksiniz. <br>
        Sadece <b>.edu.tr</b> uzantılı mailler kabul edilir.
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
