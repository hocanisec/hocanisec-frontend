<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HocanıSeç | Öğrenci Doğrulama</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-wrap{min-height:100vh; display:grid; place-items:center; padding:24px; background: #f8fafc;}
    .auth-card{width:min(520px, 100%); background:white; border:1px solid #e5e7eb; border-radius:24px; box-shadow:0 10px 24px rgba(2,6,23,.08); padding:32px}
    .auth-card h1{font-size:24px; margin-bottom:8px; font-weight:800; letter-spacing: -0.02em;}
    .auth-card p{color:#64748b; font-size:15px; margin-bottom:24px}
    
    .row{display:flex; gap:10px; align-items:center}
    input[type="email"], input[type="text"]{width:100%; border:1px solid #e5e7eb; border-radius:14px; padding:14px; font-size:15px; outline:none; transition: all 0.2s;}
    input:focus{border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,0.1)}
    
    button{border:none; cursor:pointer; padding:14px 20px; border-radius:14px; background:#2563eb; color:white; font-weight:800; transition: all 0.2s;}
    button:hover{background: #1e40af; transform: translateY(-1px)}
    button:disabled{opacity:.5; cursor:not-allowed; transform: none}
    
    /* Onay Kutuları Alanı */
    .terms-box {
      margin: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: #f1f5f9;
      border-radius: 16px;
    }
    .term-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
    }
    .term-item input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      cursor: pointer;
    }
    .term-label {
      font-size: 13px;
      color: #475569;
      line-height: 1.4;
      user-select: none;
    }
    .term-label b { color: #2563eb; text-decoration: underline; cursor: pointer; }

    .msg{margin-top:15px; font-size:14px; padding: 10px; border-radius: 10px; display: none;}
    .msg.ok{display: block; color:#16a34a; background: #f0fdf4; border: 1px solid #bbf7d0;}
    .msg.err{display: block; color:#dc2626; background: #fef2f2; border: 1px solid #fecaca;}
    
    .sep{height:1px; background:#e5e7eb; margin:20px 0}
    .codeBox{display:none; animation: fadeIn 0.3s ease-in-out;}
    .codeBox.is-open{display:block}
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 id="authTitle">HocanıSeç'e Katıl</h1>
      <p id="authDesc">Okul mailine gelecek 6 haneli kod ile gerçek deneyimlerini paylaşmaya başla.</p>

      <label class="mini muted" style="font-size: 13px; font-weight: 700; margin-bottom: 6px; display: block;">Öğrenci E-postası (.edu.tr)</label>
      <input id="email" type="email" placeholder="ornek@metu.edu.tr" autocomplete="email" />

      <!-- ONAY KUTULARI (KAYDOLURKEN ZORUNLU) -->
      <div class="terms-box" id="signupRequirements">
        <label class="term-item">
          <input type="checkbox" id="checkKVKK">
          <span class="term-label"><b onclick="showInfo('kvkk')">KVKK Aydınlatma Metni</b>'ni okudum ve onaylıyorum.</span>
        </label>
        <label class="term-item">
          <input type="checkbox" id="checkTerms">
          <span class="term-label"><b onclick="showInfo('terms')">Kullanım Koşulları</b> ve Topluluk Kuralları'nı kabul ediyorum.</span>
        </label>
        <label class="term-item">
          <input type="checkbox" id="checkResponsibility">
          <span class="term-label">Yaptığım yorumların tüm hukuki sorumluluğunun <b>bana ait olduğunu</b> beyan ederim.</span>
        </label>
      </div>

      <button id="sendBtn" style="width: 100%; margin-top: 10px;">Kodu Gönder</button>

      <div id="codeBox" class="codeBox">
        <div class="sep"></div>
        <label class="mini muted" style="font-size: 13px; font-weight: 700; margin-bottom: 6px; display: block;">Doğrulama Kodu</label>
        <div class="row">
          <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="123456" />
          <button id="verifyBtn">Doğrula</button>
        </div>
        <div class="row" style="margin-top:12px">
          <button id="resendBtn" style="background:#64748b; flex: 1;">Tekrar Gönder</button>
          <button id="logoutBtn" style="background:#0f172a; flex: 1;">Çıkış Yap</button>
        </div>
      </div>

      <div id="status" class="msg"></div>

      <div class="sep"></div>
      <div style="font-size: 12px; color: #94a3b8; text-align: center;">
        Hesabın varsa e-postanı girip direkt giriş yapabilirsin. <br>
        Onay kutuları sadece ilk kayıt için gereklidir.
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
